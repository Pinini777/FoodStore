<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store | Iniciar Sesión</title>
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,0..100,0..1&amp;family=Nunito:wght@400;700;800&amp;display=swap">
    <link rel="stylesheet" href="/src/styles/login.css">
</head>
<body class="cargando">

    <main class="login-contenedor">
        <section class="login-card">
            <img class="login-logo" src="/assets/img/logo.svg" alt="Logo de Food Store" width="96" height="96">

            <h1>Food Store</h1>
            <h2 class="login-subtitulo">Iniciar Sesión</h2>

            <p id="mensaje" class="mensaje"></p>

            <form id="form" class="login-form">
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>

            <p class="login-registro">¿No tenés cuenta? <a href="../registro/registro.html">Registrate acá</a></p>
        </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./login.ts"></script>
</body>
</html>
