<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store | Registro</title>
    <link rel="icon" href="/FoodStore/assets/img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,0..100,0..1&amp;family=Nunito:wght@400;700;800&amp;display=swap">
  <script type="module" crossorigin src="/FoodStore/assets/registro-CNkCe2jG.js"></script>
  <link rel="modulepreload" crossorigin href="/FoodStore/assets/main-hBd3-FF4.js">
  <link rel="stylesheet" crossorigin href="/FoodStore/assets/login-CdiirE1B.css">
</head>
<body class="cargando">

    <main class="login-contenedor">
        <section class="login-card">
            <img class="login-logo" src="/FoodStore/assets/img/logo.svg" alt="Logo de Food Store" width="96" height="96">

            <h1>Food Store</h1>
            <h2 class="login-subtitulo">Crear Cuenta</h2>

            <p id="mensaje" class="mensaje"></p>

            <form id="form" class="login-form">
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
                </div>

                <div class="campo">
                    <label for="confirmar">Repetir contraseña:</label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repetí la contraseña" minlength="8" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-ingresar">Registrarme</button>
            </form>

            <p class="login-registro">¿Ya tenés cuenta? <a href="../login/login.html">Iniciá sesión</a></p>
        </section>
    </main>

</body>
</html>
